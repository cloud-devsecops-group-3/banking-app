<!doctype html>
<!--
  base.html
  The master layout template. All other pages extend this file.

  Jinja2 template inheritance works like this:
    - base.html defines the overall HTML structure and common elements
    - Child templates use {% extends "base.html" %} to inherit this layout
    - {% block content %}{% endblock %} is a placeholder that child templates fill in
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title — child templates can override this block -->
    <title>{% block title %}EastWest Bank{% endblock %}</title>

    <!-- Bootstrap 5 CSS — provides responsive grid and UI components -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons — used for checkmarks, icons, etc. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Our custom CSS -->
    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ======================================================
       Navigation Bar
       url_for('dashboard.index') generates the URL for the
       dashboard route defined in routes/dashboard.py
  ====================================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark ew-navbar">
      <div class="container">
        <!-- Bank logo / brand -->
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="{{ url_for('dashboard.index') }}"
        >
          <i class="bi bi-bank2 fs-4"></i>
          <span class="fw-bold">EastWest Bank</span>
        </a>

        <!-- Tagline shown on larger screens -->
        <span class="navbar-text d-none d-md-block text-white-50 small">
          Secure Online Banking
        </span>
      </div>
    </nav>

    <!-- ======================================================
       Main Content Area
       {% block content %} is where child templates inject their HTML
  ====================================================== -->
    <main class="ew-main">{% block content %}{% endblock %}</main>

    <!-- ======================================================
       Footer
  ====================================================== -->
    <footer class="ew-footer text-center py-3">
      <small class="text-muted">
        &copy; 2025 EastWest Bank &mdash; QR Payment Demo &mdash; All rights
        reserved.
      </small>
    </footer>

    <!-- Bootstrap 5 JavaScript (required for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Optional extra scripts block for child templates -->
    {% block scripts %}{% endblock %}
  </body>
</html>
