<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EastWest Bank{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Custom EastWest Bank CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark ew-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('dashboard.index') }}">
        <i class="bi bi-bank2 fs-4"></i>
        <span class="fw-bold">EastWest Bank</span>
      </a>
      <span class="navbar-text d-none d-md-block text-white-50 small">
        Secure Online Banking
      </span>
    </div>
  </nav>

  <!-- Main content — child templates fill this block -->
  <main class="ew-main">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="ew-footer text-center py-3">
    <small class="text-muted">
      &copy; 2025 EastWest Bank &mdash; QR Payment Demo &mdash; All rights reserved.
    </small>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Page-specific scripts — child templates fill this block -->
  {% block scripts %}
  {% endblock %}

  <!-- ============================================================
       DEV NAV — Frontend preview only. Remove before production.
       Floating toolbar to jump between every page without needing
       to manually type URLs.
  ============================================================ -->
  <div id="devNav">
    <div class="dev-nav-label">
      <i class="bi bi-code-slash"></i> Dev Preview
    </div>
    <div class="dev-nav-links">
      <a href="/dashboard" class="dev-nav-btn">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
      <a href="/pay?order_id=1001&amount=450.00&merchant=pageturn-books" class="dev-nav-btn">
        <i class="bi bi-person-check"></i>
        <span>Select Account</span>
      </a>
      <a href="#" class="dev-nav-btn" onclick="previewConfirm(); return false;">
        <i class="bi bi-receipt"></i>
        <span>Confirm Payment</span>
      </a>
      <a href="#" class="dev-nav-btn" onclick="previewComplete(); return false;">
        <i class="bi bi-check-circle"></i>
        <span>Txn Complete</span>
      </a>
      <a href="/qr" class="dev-nav-btn">
        <i class="bi bi-qr-code"></i>
        <span>QR Gen</span>
      </a>
      <a href="/qr-scanner" class="dev-nav-btn">
        <i class="bi bi-camera"></i>
        <span>Scanner</span>
      </a>
      <a href="/health" class="dev-nav-btn" target="_blank">
        <i class="bi bi-heart-pulse"></i>
        <span>Health</span>
      </a>
    </div>
    <button class="dev-nav-toggle" onclick="toggleDevNav()" title="Toggle Dev Nav">
      <i class="bi bi-tools" id="devNavIcon"></i>
    </button>
  </div>

  <script>
    /* Submit a hidden form to POST /pay so the confirm page renders correctly */
    function previewConfirm() {
      var f = document.createElement('form');
      f.method = 'POST';
      f.action = '/pay';
      var fields = { account_id: '1', order_id: '1001', amount: '450.00', merchant: 'pageturn-books' };
      Object.entries(fields).forEach(function([k, v]) {
        var i = document.createElement('input');
        i.type = 'hidden'; i.name = k; i.value = v;
        f.appendChild(i);
      });
      document.body.appendChild(f);
      f.submit();
    }

    /* POST to /confirm-payment which sets the session and redirects to /complete */
    function previewComplete() {
      var f = document.createElement('form');
      f.method = 'POST';
      f.action = '/confirm-payment';
      var fields = { account_id: '1', order_id: '1001', amount: '450.00', merchant: 'pageturn-books' };
      Object.entries(fields).forEach(function([k, v]) {
        var i = document.createElement('input');
        i.type = 'hidden'; i.name = k; i.value = v;
        f.appendChild(i);
      });
      document.body.appendChild(f);
      f.submit();
    }

    /* Collapse / expand the toolbar */
    function toggleDevNav() {
      var nav = document.getElementById('devNav');
      var icon = document.getElementById('devNavIcon');
      nav.classList.toggle('collapsed');
      icon.className = nav.classList.contains('collapsed') ? 'bi bi-tools' : 'bi bi-x-lg';
    }

    /* Highlight the button that matches the current page */
    (function highlightActive() {
      var path = window.location.pathname;
      document.querySelectorAll('.dev-nav-btn').forEach(function(btn) {
        var href = btn.getAttribute('href');
        if (href && href !== '#' && path === href.split('?')[0]) {
          btn.classList.add('active');
        }
      });
    })();
  </script>

</body>
</html>
