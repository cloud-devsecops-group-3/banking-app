<!--
  error.html
  Generic error page shown when something goes wrong
  (e.g., missing QR code parameters, invalid amount).

  Variables:
    - message : string describing the error
-->
{% extends "base.html" %}

{% block title %}Error — EastWest Bank{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="ew-card shadow-sm text-center">
        <div class="px-4 py-5">
          <div class="text-danger mb-4" style="font-size: 4rem;">
            <i class="bi bi-exclamation-circle"></i>
          </div>
          <h2 class="h4 fw-bold mb-3">Something went wrong</h2>
          <p class="text-muted mb-4">{{ message }}</p>
          <a href="{{ url_for('dashboard.index') }}" class="btn ew-btn-primary">
            <i class="bi bi-house me-1"></i> Go to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
